# GitHub Pages config — serves the README as a navigable site.
# Enable: repo Settings → Pages → Deploy from a branch → main / (root)
theme: jekyll-theme-minimal
title: Student Offers
description: Every student discount, credit, freebie and free tool — sorted by category and country.
show_downloads: false
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-titles-from-headings

# Parse markdown inside HTML blocks (the README wraps its header
# badges/links in <div align="center"> — without this kramdown
# renders them as literal text)
kramdown:
  parse_block_html: true
