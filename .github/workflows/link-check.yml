name: Link check

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,401,403,406,412,429
            --timeout 30
            --max-retries 2
            --exclude-loopback
            './**/*.md'
          format: markdown
          output: lychee-report.md
          fail: false # flip to true once the backlog of flaky links is triaged

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 14

      # Keep at most one living link-check issue: close previous reports before
      # a new one is created, and auto-close them when a run comes back clean.
      - name: Close previous link-check issues
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.lychee.outputs.exit_code }}' === '0';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'links,automated',
              per_page: 50,
            });
            for (const issue of issues.filter((i) => !i.pull_request)) {
              const body = passed
                ? 'Latest weekly run is clean — closing this report.'
                : 'Superseded by the latest weekly report — see the newest issue for the current list.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Create issue on failure (scheduled runs only)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Weekly link check found dead links
          content-filepath: lychee-report.md
          labels: links, automated
